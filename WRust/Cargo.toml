[package]
name = "hyprcontext_core"
version = "0.1.0"
edition = "2021"
description = "HyprContext Rust Core - Personal AI Memory Agent Daemon"
authors = ["Ozhan"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
config = "0.14"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Notifications
notify-rust = "4"

# Base64 encoding (for images)
base64 = "0.22"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Database (SQLite for metadata + simple vector storage)
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI arguments
clap = { version = "4", features = ["derive"] }

# File watching (optional)
notify = "6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true






