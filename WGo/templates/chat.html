{{define "content"}}
<div class="max-w-3xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold" style="color: var(--text-primary)">💬 Hafıza Chat</h1>
        <p style="color: var(--text-muted)" class="mt-1">Geçmiş aktivitelerin hakkında soru sor</p>
    </div>

    <!-- Chat Container -->
    <div class="card p-6 mb-4">
        <div id="chatMessages" class="space-y-4 max-h-[500px] overflow-y-auto mb-4">
            <!-- Welcome -->
            <div class="flex gap-3">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold" style="background: var(--accent)">🧠</div>
                <div class="flex-1 rounded-lg p-4" style="background: var(--bg-secondary)">
                    <p class="text-sm" style="color: var(--text-primary)">Merhaba! Geçmiş aktivitelerin hakkında sorular sorabilirsin.</p>
                    <p class="text-xs mt-2" style="color: var(--text-muted)">Örnek sorular:</p>
                    <ul class="text-xs mt-1 space-y-1" style="color: var(--text-muted)">
                        <li>• "Bugün ne yaptım?"</li>
                        <li>• "Bu hafta Python'da ne kadar çalıştım?"</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="flex gap-3">
            <input type="text" id="chatInput" class="input flex-1" placeholder="Sorunuzu yazın..." 
                   onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="btn btn-primary">Gönder</button>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="card p-4">
        <h3 class="text-sm font-semibold mb-3" style="color: var(--text-muted)">Hızlı Sorular</h3>
        <div class="flex flex-wrap gap-2">
            <button onclick="askQuick('Bugün ne yaptım?')" class="btn btn-secondary text-sm">📅 Bugün</button>
            <button onclick="askQuick('Bu hafta en çok ne üzerinde çalıştım?')" class="btn btn-secondary text-sm">📊 Hafta özet</button>
            <button onclick="askQuick('En verimli saatlerim?')" class="btn btn-secondary text-sm">⏰ Verimli saatler</button>
        </div>
    </div>
</div>

<script>
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');

function addMessage(content, isUser = false) {
    const div = document.createElement('div');
    div.className = 'flex gap-3';
    
    if (isUser) {
        div.innerHTML = `
            <div class="flex-1 text-right">
                <div class="inline-block rounded-lg p-4 max-w-[80%]" style="background: var(--accent); color: white">
                    <p class="text-sm">${content}</p>
                </div>
            </div>
            <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background: var(--bg-secondary)">👤</div>
        `;
    } else {
        div.innerHTML = `
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold" style="background: var(--accent)">🧠</div>
            <div class="flex-1 rounded-lg p-4 max-w-[80%]" style="background: var(--bg-secondary)">
                <p class="text-sm whitespace-pre-wrap" style="color: var(--text-primary)">${content}</p>
            </div>
        `;
    }
    
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function addLoading() {
    const div = document.createElement('div');
    div.className = 'flex gap-3';
    div.id = 'loadingMessage';
    div.innerHTML = `
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold" style="background: var(--accent)">🧠</div>
        <div class="flex-1 rounded-lg p-4" style="background: var(--bg-secondary)">
            <div class="flex items-center gap-2">
                <div class="loading"></div>
                <span class="text-sm" style="color: var(--text-muted)">Düşünüyorum...</span>
            </div>
        </div>
    `;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeLoading() {
    const el = document.getElementById('loadingMessage');
    if (el) el.remove();
}

async function sendMessage() {
    const question = chatInput.value.trim();
    if (!question) return;
    
    chatInput.value = '';
    addMessage(question, true);
    addLoading();
    
    try {
        const response = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question })
        });
        const data = await response.json();
        removeLoading();
        addMessage(data.error ? '❌ ' + data.error : data.answer);
    } catch (error) {
        removeLoading();
        addMessage('❌ Bağlantı hatası');
    }
}

function askQuick(q) {
    chatInput.value = q;
    sendMessage();
}
</script>
{{end}}
