kullanici:
  ad: "Özhan Gebeşoğlu"
  dogum_yili: 2002
  rol: "Bilisim Sistemleri ve Teknolojileri öğrencisi, full-stack geliştirici, girişimci"
  genel_tanim: >
    Teknolojiye erken yaşta ilgi duymuş, yapay zekâ ve sistem tasarımına doğal yatkınlığı olan,
    proje odaklı çalışan, bağımsız üretim kapasitesi yüksek bir geliştirici. Kendi ekosistemini
    kurmaya çalışan, yazılım ve donanım ilişkisini birlikte değerlendirebilen, üretken ve deneysel
    öğrenme stiline sahip.

