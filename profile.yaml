projeler:
  aktif_projeler:
    - ad: "BAM Platformu"
      aciklama: >
        Haber ve içerik yönetimi — React + NestJS tabanlı kurumsal bir platform. Admin panel,
        RBAC, analytics, makale yönetimi ve gelir takibi içerir.
    - ad: "ButcherTrack"
      aciklama: >
        Kasaplar için geliştirilen finans, stok, gelir-gider ve ürün takibi uygulaması.
        Flutter + Dart tabanlı mobil uygulama; ileride SaaS modeli hedefleniyor.
    - ad: "Kişisel Yapay Zeka Asistanı"
      aciklama: >
        Kullanıcının günlük rutinini öğrenen, bilgisayar ekranını analiz eden, görev oluşturan,
        çalışma tarzını modelleyen yapay zekâ projesi. Hedef: kişiyi tanıyan tam kişisel AI.
    - ad: "Günlük Defteri"
      aciklama: "Kişisel günlük tutma uygulaması."
    - ad: "Faturamatik"
      aciklama: "Fatura takip web uygulaması."

