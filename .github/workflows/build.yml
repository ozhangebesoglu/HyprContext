name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Backend Executable
        run: |
          # Proje kökünden çalıştır, tüm backend paketini dahil et
          pyinstaller --onefile --name hyprcontext-backend \
            --paths=. \
            --hidden-import=backend \
            --hidden-import=backend.main \
            --hidden-import=backend.core \
            --hidden-import=backend.core.config \
            --hidden-import=backend.core.dependencies \
            --hidden-import=backend.core.exceptions \
            --hidden-import=backend.api \
            --hidden-import=backend.api.routes \
            --hidden-import=backend.api.websocket \
            --hidden-import=backend.adapters \
            --hidden-import=backend.interfaces \
            --hidden-import=backend.models \
            --hidden-import=backend.repositories \
            --hidden-import=backend.services \
            --hidden-import=uvicorn \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --collect-submodules=backend \
            --add-data "profile.yaml:." \
            --add-data "hafiza_db:hafiza_db" \
            --add-data "backend:backend" \
            backend/entry.py
          mkdir -p frontend/backend-dist
          cp dist/hyprcontext-backend frontend/backend-dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Electron App (Linux)
        working-directory: frontend
        run: npm run electron:build -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            frontend/dist-electron/*.AppImage
            frontend/dist-electron/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Backend Executable
        shell: bash
        run: |
          # Proje kökünden çalıştır, tüm backend paketini dahil et (Windows ; kullanır)
          pyinstaller --onefile --name hyprcontext-backend \
            --paths=. \
            --hidden-import=backend \
            --hidden-import=backend.main \
            --hidden-import=backend.core \
            --hidden-import=backend.core.config \
            --hidden-import=backend.core.dependencies \
            --hidden-import=backend.core.exceptions \
            --hidden-import=backend.api \
            --hidden-import=backend.api.routes \
            --hidden-import=backend.api.websocket \
            --hidden-import=backend.adapters \
            --hidden-import=backend.interfaces \
            --hidden-import=backend.models \
            --hidden-import=backend.repositories \
            --hidden-import=backend.services \
            --hidden-import=uvicorn \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --collect-submodules=backend \
            --add-data "profile.yaml;." \
            --add-data "hafiza_db;hafiza_db" \
            --add-data "backend;backend" \
            backend/entry.py
          mkdir -p frontend/backend-dist
          cp dist/hyprcontext-backend.exe frontend/backend-dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Electron App (Windows)
        working-directory: frontend
        run: npm run electron:build -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            frontend/dist-electron/*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
